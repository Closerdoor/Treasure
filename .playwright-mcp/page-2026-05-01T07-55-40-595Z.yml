            - link "imperial phase" [ref=e776] [cursor=pointer]:
              - /url: /wiki/Imperial_phase
            - text: "\". He described the recreation of Jackson's Motown 25 performance as a highlight, but described the depiction of Jackson's songwriting process as \"less forensic\" and concluded that a sequel would be difficult."
            - superscript [ref=e777]:
              - link "[80]" [ref=e778] [cursor=pointer]:
                - /url: "#cite_note-80"
          - paragraph [ref=e779]:
            - text: John Nugent of
            - link "Empire" [ref=e781] [cursor=pointer]:
              - /url: /wiki/Empire_(magazine)
            - text: gave Michael two out of five, calling it a "cosplay tribute with no artistic point of view".
            - superscript [ref=e782]:
