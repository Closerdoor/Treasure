            - text: ", writing: \"Jaafar fabricates Michael's onstage dancing and singing style with terrific, intuitive flair and the film naturally zaps you with the superb tracks themselves... But this is a frustratingly shallow, inert picture, a kind of cruise-ship entertainment, which can't quite bring itself to show that Michael was an abuse victim, brutalised by his father and robbed of his childhood.\""
