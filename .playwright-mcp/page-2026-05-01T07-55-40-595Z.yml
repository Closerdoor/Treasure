            - text: "gave it one out of four, writing: \"Fuqua might've had some cameras and microphones on hand to produce moving images and sound for this estate-approved King of Pop biopic. But make no mistake about it: Michael isn't a movie. It's a filmed playlist in search of a story.\""
            - superscript [ref=e794]:
              - link "[84]" [ref=e795] [cursor=pointer]:
                - /url: "#cite_note-84"
          - paragraph [ref=e796]:
            - text: Several critics noted the lack of mention of the abuse allegations.
            - superscript [ref=e797]:
              - link "[85]" [ref=e798] [cursor=pointer]:
                - /url: "#cite_note-McIntosh-2026-85"
            - text: The
            - link "Telegraph" [ref=e800] [cursor=pointer]:
              - /url: /wiki/The_Daily_Telegraph
            - text: critic
            - link "Robbie Collin" [ref=e801] [cursor=pointer]:
              - /url: /wiki/Robbie_Collin
            - text: said Michael "refused to address the
            - link "elephant in the room" [ref=e802] [cursor=pointer]:
              - /url: /wiki/Elephant_in_the_room
            - text: "\" and that it was not credible for a Michael Jackson biography to avoid addressing \"the accusations, controversies and sadness that dogged his later life\"."
            - superscript [ref=e803]:
              - link "[85]" [ref=e804] [cursor=pointer]:
                - /url: "#cite_note-McIntosh-2026-85"
            - link "IndieWire" [ref=e806] [cursor=pointer]:
              - /url: /wiki/IndieWire
            - text: critic Kate Erbland wrote that by omitting the allegations "the final film has been mostly stripped of any humanity, good and bad", calling it "glossy, sanitised, and surprisingly dull".
            - superscript [ref=e807]:
              - link "[85]" [ref=e808] [cursor=pointer]:
                - /url: "#cite_note-McIntosh-2026-85"
            - text: The
            - link "WBUR-FM" [ref=e809] [cursor=pointer]:
              - /url: /wiki/WBUR-FM
            - text: critic Sean Burns likened the film ending with Jackson's Bad tour to "an
            - link "O. J. Simpson" [ref=e810] [cursor=pointer]:
              - /url: /wiki/O._J._Simpson
            - text: biopic [ending] with him winning the
            - link "Heisman Trophy" [ref=e811] [cursor=pointer]:
