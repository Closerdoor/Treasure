            - superscript [ref=e713]:
              - link "[67]" [ref=e714] [cursor=pointer]:
                - /url: "#cite_note-67"
            - text: It was viewed 30 million times in its first six hours and 116.2 million times in 24 hours, more than the first 24 hours of any other Lionsgate film and more than any trailer for a musical biopic or concert film in history, surpassing
            - 'link "Taylor Swift: The Eras Tour" [ref=e716] [cursor=pointer]':
