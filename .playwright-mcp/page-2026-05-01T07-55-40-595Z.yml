            - text: and
            - link "Elton John" [ref=e827] [cursor=pointer]:
              - /url: /wiki/Elton_John
            - text: ", who also have \"complicated histories\", and that critics did not recognize the craft in the film. He also suggested that some of the criticism reflected a"
            - link "racial" [ref=e828] [cursor=pointer]:
