                - /url: "#cite_note-81"
            - link "Peter Bradshaw" [ref=e784] [cursor=pointer]:
              - /url: /wiki/Peter_Bradshaw
            - text: gave it two out of five in
            - link "The Guardian" [ref=e786] [cursor=pointer]:
