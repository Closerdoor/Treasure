          - heading "Reception" [level=2] [ref=e720]
          - heading "Box office" [level=3] [ref=e722]
          - paragraph [ref=e723]:
            - text: As of April 30, 2026 , Michael has grossed $123 million in the United States and Canada, and $155 million in other territories, for a worldwide total of $278 million.
            - superscript [ref=e724]:
              - link "[8]" [ref=e725] [cursor=pointer]:
                - /url: "#cite_note-BOM-8"
            - superscript [ref=e726]:
              - link "[9]" [ref=e727] [cursor=pointer]:
                - /url: "#cite_note-NUM-9"
          - paragraph [ref=e728]:
            - text: On April 2, three weeks before its release, Deadline Hollywood reported an opening weekend estimate of $50–60 million in the United States and Canada.
            - superscript [ref=e729]:
              - link "[69]" [ref=e730] [cursor=pointer]:
                - /url: "#cite_note-69"
            - text: Following the premiere, estimates were raised to $65–70 million from 3,900 screens.
            - superscript [ref=e731]:
              - link "[7]" [ref=e732] [cursor=pointer]:
                - /url: "#cite_note-Deadline-Proj-7"
            - text: The film made $12.6 million from Wednesday and Thursday night previews, increasing estimates to $85 million.
            - superscript [ref=e733]:
              - link "[70]" [ref=e734] [cursor=pointer]:
                - /url: "#cite_note-opening-70"
            - superscript [ref=e735]:
              - link "[71]" [ref=e736] [cursor=pointer]:
                - /url: "#cite_note-71"
            - text: Michael made $39.5 million on its first day, surpassing
            - link "Oppenheimer" [ref=e737] [cursor=pointer]:
              - /url: /wiki/Oppenheimer_(2023_film)
            - text: for the biggest opening day ever for a biographical film, and the highest opening day of any film in 2026.
            - superscript [ref=e738]:
              - link "[72]" [ref=e739] [cursor=pointer]:
                - /url: "#cite_note-72"
            - text: It went on to debut to $97 million, the best-ever for a biographical and musical film.
            - superscript [ref=e740]:
              - link "[70]" [ref=e741] [cursor=pointer]:
                - /url: "#cite_note-opening-70"
          - paragraph [ref=e742]:
            - text: In international territories, Michael was projected to gross $75–80 million from 83 countries in its opening weekend.
            - superscript [ref=e743]:
              - link "[7]" [ref=e744] [cursor=pointer]:
                - /url: "#cite_note-Deadline-Proj-7"
            - text: By April 23, it had made $18.5 million, setting first-day box office records for a musical biopic in numerous countries.
            - superscript [ref=e745]:
              - link "[73]" [ref=e746] [cursor=pointer]:
                - /url: "#cite_note-internationalopeningboxoffice-73"
            - superscript [ref=e747]:
              - link "[74]" [ref=e748] [cursor=pointer]:
                - /url: "#cite_note-74"
          - heading "Critical response" [level=3] [ref=e750]
          - paragraph [ref=e751]:
            - text: On the
            - link "review aggregator" [ref=e752] [cursor=pointer]:
              - /url: /wiki/Review_aggregator
            - text: website
            - link "Rotten Tomatoes" [ref=e753] [cursor=pointer]:
              - /url: /wiki/Rotten_Tomatoes
            - text: ", 38% of 244 critics' reviews are positive. The website's consensus reads: \"While Jaafar Jackson's smooth moves bring the King of Pop to uncanny life, this musical biopic mostly plays like a 'greatest hits' album that could've benefitted from including liner notes to give actual insight into the icon.\""
            - superscript [ref=e754]:
              - link "[75]" [ref=e755] [cursor=pointer]:
                - /url: "#cite_note-Rotten_Tomatoes-75"
            - link "Metacritic" [ref=e756] [cursor=pointer]:
              - /url: /wiki/Metacritic
            - text: ", which uses a"
            - link "weighted average" [ref=e757] [cursor=pointer]:
              - /url: /wiki/Weighted_arithmetic_mean
            - text: ", assigned the film a score of 39 out of 100, based on 50 critics, indicating \"generally unfavorable\" reviews."
            - superscript [ref=e758]:
              - link "[76]" [ref=e759] [cursor=pointer]:
                - /url: "#cite_note-Metacritic-76"
            - text: Audiences polled by
            - link "CinemaScore" [ref=e760] [cursor=pointer]:
              - /url: /wiki/CinemaScore
            - text: gave the film an average grade of "A–" on an A+ to F scale, while those surveyed by
            - link "PostTrak" [ref=e761] [cursor=pointer]:
              - /url: /wiki/PostTrak
            - text: gave it a 90% positive score, with 84% saying they would definitely recommend it.
            - superscript [ref=e762]:
              - link "[70]" [ref=e763] [cursor=pointer]:
                - /url: "#cite_note-opening-70"
          - paragraph [ref=e764]:
            - text: "Pete Hammond of Deadline wrote: \"You are bound to leave this one dancing. And what is wrong with that?\""
            - superscript [ref=e765]:
              - link "[77]" [ref=e766] [cursor=pointer]:
                - /url: "#cite_note-77"
            - link "Owen Gleiberman" [ref=e767] [cursor=pointer]:
              - /url: /wiki/Owen_Gleiberman
            - text: of Variety called Michael a "surprisingly effective middle-of-the-road biopic". He praised Jaafar's performance, writing that he "nails the look, the voice, the electrostatic moves — and the mix of delicacy and steel that made Michael who he was".
            - superscript [ref=e768]:
              - link "[78]" [ref=e769] [cursor=pointer]:
                - /url: "#cite_note-78"
            - text: Abhimanyu Mathur of
            - link "Hindustan Times" [ref=e771] [cursor=pointer]:
              - /url: /wiki/Hindustan_Times
            - text: gave Michael four out of five, describing it as a "fun, soulful" film that "hits all the right notes" and praising Jaafar, but noted pacing and structural problems.
            - superscript [ref=e772]:
