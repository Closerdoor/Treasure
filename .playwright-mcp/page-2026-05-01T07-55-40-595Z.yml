          - heading "Production" [level=2] [ref=e448]
          - heading "Development and casting" [level=3] [ref=e450]
          - generic [ref=e452]:
            - generic [ref=e453]:
              - link [ref=e457] [cursor=pointer]:
                - /url: /wiki/File:Michael_Jackson_in_1983.jpg
                - img [ref=e458]
              - link [ref=e462] [cursor=pointer]:
                - /url: /wiki/File:Jaafar_Jackson.jpg
                - img [ref=e463]
            - generic [ref=e465]:
              - link "Michael Jackson" [ref=e466] [cursor=pointer]:
                - /url: /wiki/Michael_Jackson
              - text: (left) is portrayed by his nephew
              - link "Jaafar Jackson" [ref=e467] [cursor=pointer]:
                - /url: /wiki/Jaafar_Jackson
              - text: .
          - paragraph [ref=e468]:
            - text: In November 2019,
            - link "Deadline Hollywood" [ref=e470] [cursor=pointer]:
              - /url: /wiki/Deadline_Hollywood
            - text: reported that the English producer
            - link "Graham King" [ref=e471] [cursor=pointer]:
              - /url: /wiki/Graham_King
            - text: had secured the rights to produce a film about pop singer
            - link "Michael Jackson" [ref=e472] [cursor=pointer]:
              - /url: /wiki/Michael_Jackson
            - text: ", with"
            - link "John Logan" [ref=e473] [cursor=pointer]:
              - /url: /wiki/John_Logan_(writer)
            - text: as the screenwriter.
            - superscript [ref=e474]:
              - link "[10]" [ref=e475] [cursor=pointer]:
                - /url: "#cite_note-LoganNov2019-10"
            - text: In February 2022, the film was announced with
            - link "Lionsgate Films" [ref=e476] [cursor=pointer]:
              - /url: /wiki/Lionsgate_Films
            - text: owning the global distribution rights.
            - superscript [ref=e477]:
              - link "[1]" [ref=e478] [cursor=pointer]:
                - /url: "#cite_note-Deadline-1"
            - text: In October 2023, Lionsgate announced that
            - link "Universal Pictures International" [ref=e479] [cursor=pointer]:
              - /url: /wiki/Universal_Pictures_International
            - text: would handle the international distribution.
            - superscript [ref=e480]:
              - link "[11]" [ref=e481] [cursor=pointer]:
                - /url: "#cite_note-UniversalIntlRelease-11"
            - text: In July 2024, Deadline reported that
            - link "Kino Films" [ref=e482] [cursor=pointer]:
              - /url: /w/index.php?title=Kino_Films&action=edit&redlink=1
            - generic [ref=e483]:
              - text: "["
              - link "ja" [ref=e484] [cursor=pointer]:
                - /url: https://ja.wikipedia.org/wiki/%E3%82%AD%E3%83%8E%E3%83%95%E3%82%A3%E3%83%AB%E3%83%A0%E3%82%BA
              - text: "]"
            - text: had agreed to a deal with Lionsgate and
            - link "GK Films" [ref=e485] [cursor=pointer]:
              - /url: /wiki/GK_Films
            - text: to distribute the film in Japan.
            - superscript [ref=e486]:
              - link "[12]" [ref=e487] [cursor=pointer]:
                - /url: "#cite_note-Tartaglione-2024-12"
            - text: The last theatrical film about Jackson,
            - link "Michael Jackson's This Is It" [ref=e489] [cursor=pointer]:
              - /url: /wiki/Michael_Jackson%27s_This_Is_It
            - text: (2009), had been distributed by
            - link "Columbia Pictures" [ref=e490] [cursor=pointer]:
              - /url: /wiki/Columbia_Pictures
            - text: ", which was a sister company to Jackson's record label,"
            - link "Sony Music" [ref=e491] [cursor=pointer]:
              - /url: /wiki/Sony_Music
            - text: ", although they were not involved with this film."
            - superscript [ref=e492]:
              - link "[13]" [ref=e493] [cursor=pointer]:
                - /url: "#cite_note-13"
            - text: King said he had interviewed hundreds of people who knew Jackson in preparation for the film.
            - superscript [ref=e494]:
              - link "[14]" [ref=e495] [cursor=pointer]:
                - /url: "#cite_note-VarietyUnbiased-14"
          - paragraph [ref=e496]:
            - text: In January 2023, it was announced that
            - link "Antoine Fuqua" [ref=e497] [cursor=pointer]:
              - /url: /wiki/Antoine_Fuqua
            - text: would be the director.
            - superscript [ref=e498]:
              - link "[15]" [ref=e499] [cursor=pointer]:
                - /url: "#cite_note-FuquaJan2023-15"
            - text: Casting began that month, with casting director
            - link "Kimberly Hardin" [ref=e500] [cursor=pointer]:
              - /url: /wiki/Kimberly_Hardin
            - text: ","
            - superscript [ref=e501]:
              - link "[16]" [ref=e502] [cursor=pointer]:
                - /url: "#cite_note-BackstageJun2022-16"
            - text: and Jaafar was revealed to play Michael.
            - superscript [ref=e503]:
              - link "[17]" [ref=e504] [cursor=pointer]:
                - /url: "#cite_note-JaafarJan2023-17"
            - text: Michael's mother and Jaafar's grandmother,
            - link "Katherine Jackson" [ref=e505] [cursor=pointer]:
              - /url: /wiki/Katherine_Jackson
            - text: ", was quoted as approving of the casting, saying he \"embodies\" her son."
            - superscript [ref=e506]:
              - link "[18]" [ref=e507] [cursor=pointer]:
                - /url: "#cite_note-18"
            - superscript [ref=e508]:
              - link "[19]" [ref=e509] [cursor=pointer]:
                - /url: "#cite_note-19"
            - text: Jaafar said he was "humbled and honoured" to be cast, after a two-year casting process.
            - superscript [ref=e510]:
              - link "[20]" [ref=e511] [cursor=pointer]:
                - /url: "#cite_note-20"
            - text: In January 2024, newcomer Juliano Krue Valdi was cast as a young Michael,
            - superscript [ref=e512]:
              - link "[21]" [ref=e513] [cursor=pointer]:
                - /url: "#cite_note-KrueValdi-21"
            - text: with
            - link "Colman Domingo" [ref=e514] [cursor=pointer]:
              - /url: /wiki/Colman_Domingo
            - text: as
            - link "Joe Jackson" [ref=e515] [cursor=pointer]:
              - /url: /wiki/Joe_Jackson_(talent_manager)
            - superscript [ref=e516]:
              - link "[22]" [ref=e517] [cursor=pointer]:
                - /url: "#cite_note-Domingo-22"
            - text: and
            - link "Nia Long" [ref=e518] [cursor=pointer]:
              - /url: /wiki/Nia_Long
            - text: as Katherine.
            - superscript [ref=e519]:
              - link "[23]" [ref=e520] [cursor=pointer]:
                - /url: "#cite_note-Long-23"
            - text: In February,
            - link "Miles Teller" [ref=e521] [cursor=pointer]:
              - /url: /wiki/Miles_Teller
            - text: was confirmed to play
            - link "John Branca" [ref=e522] [cursor=pointer]:
              - /url: /wiki/John_Branca
            - text: .
            - superscript [ref=e523]:
              - link "[24]" [ref=e524] [cursor=pointer]:
                - /url: "#cite_note-TellerFeb2024-24"
            - text: The cast for the rest of
            - link "the Jackson 5" [ref=e525] [cursor=pointer]:
              - /url: /wiki/The_Jackson_5
            - text: was announced later that month,
            - superscript [ref=e526]:
              - link "[25]" [ref=e527] [cursor=pointer]:
                - /url: "#cite_note-Jackson5Cast-25"
            - text: while much of the rest of the cast signed up in March.
            - superscript [ref=e528]:
              - link "[26]" [ref=e529] [cursor=pointer]:
                - /url: "#cite_note-Harrier-26"
            - superscript [ref=e530]:
              - link "[27]" [ref=e531] [cursor=pointer]:
                - /url: "#cite_note-GrahamTate-27"
            - text: In April 2024,
            - link "Derek Luke" [ref=e532] [cursor=pointer]:
              - /url: /wiki/Derek_Luke
            - text: joined as
            - link "Johnnie Cochran" [ref=e533] [cursor=pointer]:
              - /url: /wiki/Johnnie_Cochran
            - text: .
            - superscript [ref=e534]:
              - link "[28]" [ref=e535] [cursor=pointer]:
                - /url: "#cite_note-Luke-28"
            - link "Kat Graham" [ref=e536] [cursor=pointer]:
              - /url: /wiki/Kat_Graham
            - text: "'s portrayal of"
            - link "Diana Ross" [ref=e537] [cursor=pointer]:
              - /url: /wiki/Diana_Ross
            - text: was cut due to "legal considerations".
            - superscript [ref=e538]:
              - link "[29]" [ref=e539] [cursor=pointer]:
                - /url: "#cite_note-29"
          - paragraph [ref=e540]:
            - text: Michael's son, Prince, was an executive producer. His daughter,
            - link "Paris Jackson" [ref=e541] [cursor=pointer]:
              - /url: /wiki/Paris_Jackson
            - text: ", criticized the casting of Teller through a legal filing against the executors of the"
            - link "Michael Jackson estate" [ref=e542] [cursor=pointer]:
              - /url: /wiki/Estate_of_Michael_Jackson
            - text: (John Branca and John McClain), as it is risked a portion of the estate's assets. She also accused Branca of considering himself "central to the Michael Jackson story" and trying to "enrich and aggrandize himself" through such costly casting.
            - superscript [ref=e543]:
              - link "[30]" [ref=e544] [cursor=pointer]:
                - /url: "#cite_note-30"
          - heading "Writing" [level=3] [ref=e546]
          - paragraph [ref=e547]:
            - text: Earlier versions of the script included the
            - link "child sexual abuse accusations against Michael" [ref=e548] [cursor=pointer]:
              - /url: /wiki/1993_Michael_Jackson_sexual_abuse_allegations
            - text: ", with King saying he wanted to \"humanize but not sanitize and present the most compelling, unbiased story\"."
            - superscript [ref=e549]:
              - link "[14]" [ref=e550] [cursor=pointer]:
                - /url: "#cite_note-VarietyUnbiased-14"
            - text: Domingo said Michael was not "trying to prove his innocence" but was "just trying to give a great examination of an artist, what made the artist who he is, what makes him complicated, for you to leave with your own answers".
            - superscript [ref=e551]:
              - link "[31]" [ref=e552] [cursor=pointer]:
                - /url: "#cite_note-Myers-2026-31"
          - paragraph [ref=e553]:
            - text: The film originally opened
            - link "in medias res" [ref=e555] [cursor=pointer]:
              - /url: /wiki/In_medias_res
            - text: in 1993 following the first allegations, with Michael staring at his reflection as police arrive at his home in
            - link "Neverland Ranch" [ref=e556] [cursor=pointer]:
              - /url: /wiki/Neverland_Ranch
            - text: .
            - superscript [ref=e557]:
              - link "[32]" [ref=e558] [cursor=pointer]:
                - /url: "#cite_note-:0-32"
            - superscript [ref=e559]:
              - link "[6]" [ref=e560] [cursor=pointer]:
                - /url: "#cite_note-Variety_LangRubin2026-6"
            - text: The third act dealt with the impact of the allegations on Michael's life.
            - superscript [ref=e561]:
              - link "[6]" [ref=e562] [cursor=pointer]:
                - /url: "#cite_note-Variety_LangRubin2026-6"
            - text: However, all references to the allegations, including scenes of Luke as Cochran, were removed after a clause was discovered in a settlement with one of Michael's accusers, Jordan Chandler, forbidding any mention of Chandler in film.
            - superscript [ref=e563]:
              - link "[6]" [ref=e564] [cursor=pointer]:
                - /url: "#cite_note-Variety_LangRubin2026-6"
            - text: Rewrites were delayed after Logan's house was damaged in the
            - link "Palisades Fire" [ref=e565] [cursor=pointer]:
              - /url: /wiki/Palisades_Fire
            - text: .
            - superscript [ref=e566]:
              - link "[6]" [ref=e567] [cursor=pointer]:
                - /url: "#cite_note-Variety_LangRubin2026-6"
          - paragraph [ref=e568]:
            - text: Fuqua said he was submitting his final cut when he was instructed to alter the film. Eventually, he, King and Logan determined that the film would focus on Jackson's journey to becoming "a superhero on the stage". The script was being revised during filming.
            - superscript [ref=e569]:
              - link "[32]" [ref=e570] [cursor=pointer]:
                - /url: "#cite_note-:0-32"
            - text: The final script ends with Michael beginning the
            - link "Bad tour" [ref=e571] [cursor=pointer]:
              - /url: /wiki/Bad_(tour)
            - text: ", before the first allegations arose."
            - superscript [ref=e572]:
              - link "[6]" [ref=e573] [cursor=pointer]:
                - /url: "#cite_note-Variety_LangRubin2026-6"
            - text: Domingo said this was to focus on Michael's rise and peak. Long said it highlighted Michael's early journey and achievements while leaving the remainder of his life for a possible sequel.
            - superscript [ref=e574]:
              - link "[33]" [ref=e575] [cursor=pointer]:
                - /url: "#cite_note-33"
            - text: Fuqua expressed skepticism about the allegations, saying "sometimes people do some nasty things for some money".
            - superscript [ref=e576]:
              - link "[34]" [ref=e577] [cursor=pointer]:
                - /url: "#cite_note-34"
            - superscript [ref=e578]:
              - link "[35]" [ref=e579] [cursor=pointer]:
                - /url: "#cite_note-35"
            - superscript [ref=e580]:
              - text: "["
              - generic [ref=e581]:
                - link "neutrality" [ref=e582] [cursor=pointer]:
                  - /url: /wiki/Wikipedia:Neutral_point_of_view
                - text: is
                - link "disputed" [ref=e583] [cursor=pointer]:
                  - /url: /wiki/Talk:Michael_(2026_film)#Should_the_article_mention_Fuqua's_comments_on_the_sexual_abuse_allegations?
              - text: "]"
          - paragraph [ref=e584]:
            - text: Paris had no involvement in the film and described an early script as "sugar-coated", adding that
            - link "Hollywood" [ref=e585] [cursor=pointer]:
              - /url: /wiki/Hollywood,_Los_Angeles
            - text: biopics often shape narratives and contain inaccuracies.
            - superscript [ref=e586]:
              - link "[36]" [ref=e587] [cursor=pointer]:
                - /url: "#cite_note-36"
            - text: In response, Domingo expressed hope that the film would honor her father.
            - superscript [ref=e588]:
              - link "[37]" [ref=e589] [cursor=pointer]:
                - /url: "#cite_note-37"
            - text: Michael's siblings
            - link "Janet" [ref=e590] [cursor=pointer]:
              - /url: /wiki/Janet_Jackson
            - text: ","
            - link "Randy" [ref=e591] [cursor=pointer]:
              - /url: /wiki/Randy_Jackson_(Jacksons_singer)
            - text: and
            - link "Rebbie" [ref=e592] [cursor=pointer]:
              - /url: /wiki/Rebbie_Jackson
            - text: do not appear in the film; according to La Toya, Janet "kindly declined" to be included.
            - superscript [ref=e593]:
              - link "[38]" [ref=e594] [cursor=pointer]:
                - /url: "#cite_note-38"
            - superscript [ref=e595]:
              - link "[39]" [ref=e596] [cursor=pointer]:
                - /url: "#cite_note-39"
          - heading "Filming" [level=3] [ref=e598]
          - paragraph [ref=e599]:
            - link "Principal photography" [ref=e600] [cursor=pointer]:
              - /url: /wiki/Principal_photography
            - text: was scheduled to begin in mid-2023 and take place over 80 days in
            - link "Santa Barbara, California" [ref=e601] [cursor=pointer]:
              - /url: /wiki/Santa_Barbara,_California
            - text: . It was projected to spend $120 million on crew wages and vendors, according to the
            - link "California Film Commission" [ref=e602] [cursor=pointer]:
              - /url: /wiki/California_Film_Commission
            - text: .
            - superscript [ref=e603]:
              - link "[40]" [ref=e604] [cursor=pointer]:
                - /url: "#cite_note-LATimesMar2023-40"
            - text: Filming was delayed in September 2023 due to the
            - link "2023 SAG-AFTRA strike" [ref=e605] [cursor=pointer]:
              - /url: /wiki/2023_SAG-AFTRA_strike
            - text: .
            - superscript [ref=e606]:
              - link "[41]" [ref=e607] [cursor=pointer]:
                - /url: "#cite_note-FilmingDelay-41"
            - text: Filming took place between January 22 and May 30, 2024.
            - superscript [ref=e608]:
              - link "[42]" [ref=e609] [cursor=pointer]:
                - /url: "#cite_note-ReleaseDate-42"
