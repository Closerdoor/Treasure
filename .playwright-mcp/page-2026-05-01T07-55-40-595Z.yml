            - text: "double standard in how Black artists are judged compared to their white counterparts. He concluded: \"This film does exactly what it should: celebrate the genius of a man who gave us countless hits. What’s wrong with giving fans what they want?\""
            - superscript [ref=e829]:
              - link "[88]" [ref=e830] [cursor=pointer]:
                - /url: "#cite_note-88"
          - heading "Sequel" [level=2] [ref=e832]
          - paragraph [ref=e833]:
            - text: Splitting Michael into two films was considered during production, but the production team decided to create a single film that could stand alone. During post-production, the ending card "His story continues" was added, likely teasing a potential sequel. In April 2026, the chairman of Lionsgate, Adam Fogelson, said that a sequel would depend on the critical and commercial response to the film. King acknowledged the potential for a sequel and Logan was reported to be working on a script.
            - superscript [ref=e834]:
              - link "[89]" [ref=e835] [cursor=pointer]:
                - /url: "#cite_note-Future_THR-89"
            - text: That month, Fogelson announced that a sequel had been green-lit on the Town podcast.
            - superscript [ref=e836]:
              - link "[90]" [ref=e837] [cursor=pointer]:
                - /url: "#cite_note-90"
            - text: Fuqua said that enough footage had been filmed to support a sequel covering Jackson's later life.
            - superscript [ref=e838]:
              - link "[91]" [ref=e839] [cursor=pointer]:
                - /url: "#cite_note-91"
