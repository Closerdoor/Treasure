            - text: "\"."
            - superscript [ref=e812]:
              - link "[86]" [ref=e813] [cursor=pointer]:
                - /url: "#cite_note-86"
          - paragraph [ref=e814]:
            - text: The Guardian characterized Michael as one of several recent biographical films that presented "sanitized" portraits of beloved musicians, such as
            - link "Bohemian Rhapsody" [ref=e816] [cursor=pointer]:
              - /url: /wiki/Bohemian_Rhapsody_(film)
            - text: (2018),
            - link "Elvis" [ref=e818] [cursor=pointer]:
              - /url: /wiki/Elvis_(2022_film)
            - text: (2022) and
            - link "Back to Black" [ref=e820] [cursor=pointer]:
              - /url: /wiki/Back_to_Black_(film)
            - text: (2024), writing that "when it comes to objectivity, integrity and veracity, audiences will always prioritise the chance to have a singsong".
            - superscript [ref=e821]:
              - link "[87]" [ref=e822] [cursor=pointer]:
                - /url: "#cite_note-87"
            - text: In
            - link "The Root" [ref=e824] [cursor=pointer]:
              - /url: /wiki/The_Root_(magazine)
            - text: ", Lawrence Ware of"
            - link "Oklahoma State University" [ref=e825] [cursor=pointer]:
              - /url: /wiki/Oklahoma_State_University
            - text: argued that it was unfair to expect a film that only dealt with Jackson's early life to address the allegations, that critics did not make similar complaints about biopics of
            - link "Elvis Presley" [ref=e826] [cursor=pointer]:
