          - paragraph [ref=e310]:
            - generic [ref=e311]: Michael
            - text: is a 2026
            - link "biographical film" [ref=e312] [cursor=pointer]:
              - /url: /wiki/Biographical_film
            - text: directed by
            - link "Antoine Fuqua" [ref=e313] [cursor=pointer]:
              - /url: /wiki/Antoine_Fuqua
            - text: and written by
            - link "John Logan" [ref=e314] [cursor=pointer]:
              - /url: /wiki/John_Logan_(writer)
            - text: . It follows the life of American singer
            - link "Michael Jackson" [ref=e315] [cursor=pointer]:
              - /url: /wiki/Michael_Jackson
            - text: ", covering his involvement in"
            - link "the Jackson 5" [ref=e316] [cursor=pointer]:
              - /url: /wiki/The_Jackson_5
            - text: in the 1960s to the
            - link "Bad tour" [ref=e317] [cursor=pointer]:
              - /url: /wiki/Bad_(tour)
            - text: in the late 1980s. Michael is portrayed by his nephew
            - link "Jaafar Jackson" [ref=e318] [cursor=pointer]:
              - /url: /wiki/Jaafar_Jackson
            - text: and as a child by Juliano Krue Valdi, both in their film debuts. The supporting cast includes
            - link "Nia Long" [ref=e319] [cursor=pointer]:
              - /url: /wiki/Nia_Long
            - text: ", KeiLyn Durrel Jones,"
            - link "Laura Harrier" [ref=e320] [cursor=pointer]:
              - /url: /wiki/Laura_Harrier
            - text: ","
            - link "Jessica Sula" [ref=e321] [cursor=pointer]:
              - /url: /wiki/Jessica_Sula
            - text: ","
            - link "Mike Myers" [ref=e322] [cursor=pointer]:
              - /url: /wiki/Mike_Myers
            - text: ","
            - link "Miles Teller" [ref=e323] [cursor=pointer]:
              - /url: /wiki/Miles_Teller
            - text: ", and"
            - link "Colman Domingo" [ref=e324] [cursor=pointer]:
              - /url: /wiki/Colman_Domingo
            - text: .
          - paragraph [ref=e325]:
            - text: Development began in November 2019, when it was reported that the producer
            - link "Graham King" [ref=e326] [cursor=pointer]:
              - /url: /wiki/Graham_King
            - text: had secured the rights to produce a film about Michael, with Logan attached to write.
            - link "Lionsgate Films" [ref=e327] [cursor=pointer]:
              - /url: /wiki/Lionsgate_Films
            - text: announced the film in February 2022. In January 2023, Fuqua was announced as the director and Jaafar was cast as Michael. Further casting took place from January to April 2024. After delays caused by the
            - link "2023 SAG-AFTRA strike" [ref=e328] [cursor=pointer]:
              - /url: /wiki/2023_SAG-AFTRA_strike
            - text: ","
            - link "principal photography" [ref=e329] [cursor=pointer]:
              - /url: /wiki/Principal_photography
            - text: took place between January and May 2024. After a clause was discovered in a legal settlement, references to the
            - link "1993 child sexual abuse allegations against Michael" [ref=e330] [cursor=pointer]:
              - /url: /wiki/1993_Michael_Jackson_sexual_abuse_allegations
            - text: were removed, the third act was revised, and reshoots took place in June 2025, bringing the total production budget to $165–200 million.
          - paragraph [ref=e331]:
            - text: Michael premiered at the
            - link "Uber Eats Music Hall" [ref=e332] [cursor=pointer]:
              - /url: /wiki/Uber_Eats_Music_Hall
            - text: in
            - link "Berlin" [ref=e333] [cursor=pointer]:
              - /url: /wiki/Berlin
            - text: on April 10, 2026, and was released on April 22 in the UK by
            - link "Universal Pictures" [ref=e334] [cursor=pointer]:
              - /url: /wiki/Universal_Pictures_International
            - text: and on April 24 in the US by Lionsgate. It has grossed $278 million worldwide, making it the
            - link "fifth highest-grossing film of 2026" [ref=e335] [cursor=pointer]:
              - /url: /wiki/2026_in_film#Highest-grossing_films
            - text: . Michael received generally negative reviews from critics, who praised Jaafar's performance but criticized the story as "sanitized".
          - heading "Plot" [level=2] [ref=e337]
          - paragraph [ref=e338]:
            - text: In 1966, steel worker
            - link "Joseph Jackson" [ref=e339] [cursor=pointer]:
              - /url: /wiki/Joe_Jackson_(talent_manager)
            - text: assembles his five sons into the musical band
            - link "the Jackson 5" [ref=e340] [cursor=pointer]:
              - /url: /wiki/The_Jackson_5
            - text: ", with the youngest,"
            - link "Michael" [ref=e341] [cursor=pointer]:
              - /url: /wiki/Michael_Jackson
            - text: ", on lead vocals. After months of grueling rehearsals, involving"
            - link "corporal punishment" [ref=e342] [cursor=pointer]:
              - /url: /wiki/Corporal_punishment
            - text: by Joseph, the Jackson 5 perform at gigs until they are signed with
            - link "Motown" [ref=e343] [cursor=pointer]:
              - /url: /wiki/Motown
            - text: in 1969. Their albums top the charts and they sell out concerts across the US, allowing them to move from a
            - link "small house" [ref=e344] [cursor=pointer]:
              - /url: /wiki/Michael_Jackson_Childhood_Home
            - text: in
            - link "Gary, Indiana" [ref=e345] [cursor=pointer]:
              - /url: /wiki/Gary,_Indiana
            - text: ", to a"
            - link "mansion" [ref=e346] [cursor=pointer]:
              - /url: /wiki/Hayvenhurst
            - text: in
            - link "Encino, California" [ref=e347] [cursor=pointer]:
              - /url: /wiki/Encino,_Los_Angeles
            - text: ", two years later. Motown founder"
            - link "Berry Gordy" [ref=e348] [cursor=pointer]:
              - /url: /wiki/Berry_Gordy
            - text: believes Michael has more potential as a solo act.
          - paragraph [ref=e349]:
            - text: In 1978, Michael signs with
            - link "Epic Records" [ref=e350] [cursor=pointer]:
              - /url: /wiki/Epic_Records
            - text: for his first solo album as an adult,
            - link "Off the Wall" [ref=e352] [cursor=pointer]:
              - /url: /wiki/Off_the_Wall
            - text: ", with"
            - link "Quincy Jones" [ref=e353] [cursor=pointer]:
              - /url: /wiki/Quincy_Jones
            - text: producing. Despite its success, Michael is held back by Joseph, who believes he is solely responsible for his children's fortunes. Feeling insecure about his appearance and developing
            - link "vitiligo" [ref=e354] [cursor=pointer]:
              - /url: /wiki/Vitiligo
            - text: ", Michael undergoes a"
            - link "rhinoplasty" [ref=e355] [cursor=pointer]:
              - /url: /wiki/Rhinoplasty
            - text: to make his nose smaller. Following an argument with Joseph, he takes advice from his bodyguard and close friend, Bill Bray, and creates his own path. In 1981, he hires
            - link "John Branca" [ref=e356] [cursor=pointer]:
              - /url: /wiki/John_Branca
            - text: as his attorney and has him fire Joseph by fax.
          - paragraph [ref=e357]:
            - text: Aside from visiting children's hospitals, Michael experiments with ideas for his next album, which is set for release in 1982. After watching a news report on the
            - link "Crips–Bloods gang war" [ref=e358] [cursor=pointer]:
              - /url: /wiki/Crips%E2%80%93Bloods_gang_war
            - text: ", he hires members of both gangs to appear in his music video for \""
            - link "Beat It" [ref=e359] [cursor=pointer]:
              - /url: /wiki/Beat_It
            - text: "\"."
            - link "Thriller" [ref=e361] [cursor=pointer]:
              - /url: /wiki/Thriller_(album)
            - text: breaks worldwide sales records while Michael delivers a groundbreaking performance of "
            - link "Billie Jean" [ref=e362] [cursor=pointer]:
              - /url: /wiki/Billie_Jean
            - text: "\" at"
            - link "Motown 25" [ref=e363] [cursor=pointer]:
              - /url: /wiki/Motown_25:_Yesterday,_Today,_Forever
            - text: . Michael and Branca head to New York to ask the
            - link "CBS Records" [ref=e364] [cursor=pointer]:
              - /url: /wiki/Sony_Music
            - text: president,
            - link "Walter Yetnikoff" [ref=e365] [cursor=pointer]:
              - /url: /wiki/Walter_Yetnikoff
            - text: ", to get"
            - link "MTV" [ref=e366] [cursor=pointer]:
              - /url: /wiki/MTV
            - text: to play Michael's music videos. MTV agrees to give Michael airtime after Yetnikoff threatens to pull the CBS Records catalog out of the network.
          - paragraph [ref=e367]:
            - text: While Michael enjoys his success, Joseph has a meeting with the boxing promoter
            - link "Don King" [ref=e368] [cursor=pointer]:
              - /url: /wiki/Don_King
            - text: over a proposed Jacksons
            - link "reunion tour in 1984" [ref=e369] [cursor=pointer]:
              - /url: /wiki/Victory_Tour_(The_Jacksons)
            - text: . King offers Joseph a
            - link "PepsiCo" [ref=e370] [cursor=pointer]:
              - /url: /wiki/PepsiCo
            - text: sponsorship deal, provided that Michael tours with the Jacksons, to which Michael objects. While the Jacksons film a Pepsi commercial, a spark from the pyrotechnics sets Michael's hair on fire, resulting in
            - link "third-degree burns" [ref=e371] [cursor=pointer]:
              - /url: /wiki/Third-degree_burns
            - text: and nerve damage. He and Branca sue PepsiCo for the damages, with the settlement proceeds going to the
            - link "burn center" [ref=e372] [cursor=pointer]:
              - /url: /wiki/Southern_California_Hospital_at_Culver_City
            - text: where he was treated.
          - paragraph [ref=e373]:
            - text: Once Michael recovers, he agrees to tour with his siblings. During the final show, Michael announces it is the last time the Jacksons will perform together, severing his ties with Joseph. In 1988, Michael performs on the
            - link "Bad tour" [ref=e374] [cursor=pointer]:
              - /url: /wiki/Bad_(tour)
            - text: at
            - link "Wembley Stadium" [ref=e375] [cursor=pointer]:
              - /url: /wiki/Wembley_Stadium_(1923)
            - text: .
