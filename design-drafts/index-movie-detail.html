<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440">
  <title>个人收藏馆 - 电影详情页设计稿</title>
  <link rel="stylesheet" href="style-movie-detail.css">
</head>
<body>
  <header class="main-nav">
    <div class="logo">收藏馆</div>
    <nav>
      <a href="#video">影视</a>
      <a href="#book">书</a>
      <a href="#music">音乐</a>
      <a href="#game">游戏</a>
      <a href="#about">关于</a>
    </nav>
  </header>
  <main>
    <section class="movie-hero">
      <div class="movie-poster">
        <img src="https://image.tmdb.org/t/p/w500/8YFL5QQVPy3AgrEQxNYVSgiPEbe.jpg" alt="星际穿越">
      </div>
      <div class="movie-info">
        <h1>星际穿越 <span class="movie-year">2014</span></h1>
        <div class="movie-meta">导演：Nolan | 类型：科幻、冒险 | 国家：美国</div>
        <div class="movie-rating">馆长评分：9.5</div>
        <div class="movie-tags">
          <span>科幻</span><span>太空</span><span>成长</span>
        </div>
        <div class="movie-brief">一部兼具宇宙尺度与情感重量的科幻电影。</div>
      </div>
    </section>
    <section class="movie-section">
      <h2>剧情简介</h2>
      <div class="movie-summary">
        未来的地球已经难以生存，一组宇航员通过虫洞寻找人类的新家园。
      </div>
    </section>
    <section class="movie-section">
      <h2>馆长短评</h2>
      <div class="movie-curator-note">
        适合完整沉浸观看，科学与情感并重，配乐极具氛围。
      </div>
    </section>
    <section class="movie-section">
      <h2>剧照</h2>
      <div class="movie-gallery">
        <img src="https://image.tmdb.org/t/p/w300/2TeJfUZMGolfDdW6DKhfIWqvq8y.jpg" alt="剧照1">
        <img src="https://image.tmdb.org/t/p/w300/4L7v4bJyuZp0uHZ1Fz4HhZ2i2hB.jpg" alt="剧照2">
      </div>
    </section>
    <section class="movie-section">
      <h2>相关标签</h2>
      <div class="movie-tags">
        <span>科幻</span><span>太空</span><span>成长</span><span>经典</span>
      </div>
    </section>
    <section class="movie-section">
      <h2>评论区</h2>
      <div class="movie-comments">
        <div class="comment">Giscus 评论系统嵌入区</div>
      </div>
    </section>
  </main>
  <footer>
    <div>© 2026 个人收藏馆 · 精选影视、书籍、音乐与游戏</div>
    <div>数据来源于公开社区信息，评论由 Giscus 提供</div>
  </footer>
</body>
</html>
