<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440">
  <title>个人收藏馆 - 首页设计稿</title>
  <link rel="stylesheet" href="style-home.css">
</head>
<body>
  <header class="main-nav">
    <div class="logo">收藏馆</div>
    <nav>
      <a href="#video">影视</a>
      <a href="#book">书</a>
      <a href="#music">音乐</a>
      <a href="#game">游戏</a>
      <a href="#about">关于</a>
    </nav>
  </header>
  <main>
    <section class="hero">
      <div class="hero-left">
        <h1>精选型个人收藏馆</h1>
        <p>馆长筛选 · 结构化资料 · 深色极简风格</p>
      </div>
      <div class="hero-right">
        <img src="https://images.unsplash.com/photo-1464983953574-0892a716854b?auto=format&fit=crop&w=600&q=80" alt="馆主视觉" />
      </div>
    </section>
    <section class="curator-picks">
      <h2>馆长精选</h2>
      <div class="pick-list">
        <div class="pick-card">
          <img src="https://image.tmdb.org/t/p/w300/8YFL5QQVPy3AgrEQxNYVSgiPEbe.jpg" alt="星际穿越">
          <div class="pick-info">
            <div class="pick-title">星际穿越</div>
            <div class="pick-meta">2014 · Nolan</div>
          </div>
        </div>
        <div class="pick-card">
          <img src="https://image.tmdb.org/t/p/w300/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg" alt="盗梦空间">
          <div class="pick-info">
            <div class="pick-title">盗梦空间</div>
            <div class="pick-meta">2010 · Nolan</div>
          </div>
        </div>
        <div class="pick-card">
          <img src="https://image.tmdb.org/t/p/w300/6FfCtAuVAW8XJjZ7eWeLibRLWTw.jpg" alt="肖申克的救赎">
          <div class="pick-info">
            <div class="pick-title">肖申克的救赎</div>
            <div class="pick-meta">1994 · Darabont</div>
          </div>
        </div>
      </div>
    </section>
    <section class="module-entrance">
      <h2>分馆入口</h2>
      <div class="module-list">
        <a class="module-card video" href="#video">影视</a>
        <a class="module-card book" href="#book">书</a>
        <a class="module-card music" href="#music">音乐</a>
        <a class="module-card game" href="#game">游戏</a>
      </div>
    </section>
    <section class="recent-add">
      <h2>最近新增</h2>
      <div class="recent-list">
        <div class="recent-card">
          <img src="https://image.tmdb.org/t/p/w300/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg" alt="沙丘">
          <div class="recent-title">沙丘</div>
        </div>
        <div class="recent-card">
          <img src="https://image.tmdb.org/t/p/w300/2CAL2433ZeIihfX1Hb2139CX0pW.jpg" alt="爱乐之城">
          <div class="recent-title">爱乐之城</div>
        </div>
        <div class="recent-card">
          <img src="https://image.tmdb.org/t/p/w300/3bhkrj58Vtu7enYsRolD1fZdja1.jpg" alt="教父">
          <div class="recent-title">教父</div>
        </div>
      </div>
    </section>
    <section class="tag-explore">
      <h2>标签探索</h2>
      <div class="tag-list">
        <span class="tag">科幻</span>
        <span class="tag">成长</span>
        <span class="tag">动画</span>
        <span class="tag">经典</span>
        <span class="tag">音乐</span>
        <span class="tag">独立游戏</span>
      </div>
    </section>
    <section class="about">
      <h2>关于本站</h2>
      <p>本馆只收录馆长亲自筛选的影视、书籍、音乐、游戏作品，资料以公开社区信息和标准元数据为主，强调策展与结构化浏览。</p>
    </section>
  </main>
  <footer>
    <div>© 2026 个人收藏馆 · 精选影视、书籍、音乐与游戏</div>
    <div>数据来源于公开社区信息，评论由 Giscus 提供</div>
  </footer>
</body>
</html>
